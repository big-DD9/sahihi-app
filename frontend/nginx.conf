server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route not matching a real file (e.g. /dashboard,
    # /admin) serves index.html and lets React Router handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}