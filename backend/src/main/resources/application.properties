# ===============================
# Application
# ===============================
spring.application.name=sahihi

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Database (PostgreSQL)
# Values pulled from environment variables so real credentials
# never get committed to the repo. Defaults below are for local dev only.
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sahihi}
spring.datasource.username=${DB_USERNAME:sahihi_user}
spring.datasource.password=${DB_PASSWORD:sahihi_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ddl-auto=update is fine for local dev; in a real prod setup
# you'd switch to "validate" and manage schema via migrations (e.g. Flyway).
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT
# Secret must be overridden via env var in any real deployment.
# expiration is in milliseconds -> 86400000 = 24 hours
# ===============================
jwt.secret=${JWT_SECRET:Y63BdR4sYjxWDnU20IHzkIHjovQCZZTShLUXV5sJ5aY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}